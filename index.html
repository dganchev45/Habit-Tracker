  function pad2(n) { return String(n).padStart(2, '0'); }
  function toKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

      ['rect', { x: 3, y: 8, width: 14, height: 10, rx: 2 }],

    ]
  };

  var HABIT_ICON_CHOICES = ['flame', 'brain', 'dumbbell', 'droplets', 'book-open', 'pen-line', 'target', 'heart-pulse', 'music', 'code', 'languages', 'sun', 'moon', 'sparkles', 'calendar', 'zap', 'coffee', 'check'];

  // ---------- Schedule / completion predicates ----------
  function isScheduled(h, k) {
    if (k < h.createdAt) return false;
    if (h.schedule.type === 'daily') return true;
    if (h.schedule.type === 'weekdays') return h.schedule.days.indexOf(dow(k)) !== -1;
    if (h.schedule.type === 'weekly') return true;
    return false;
  }
  function scheduleLabel(h) {
    if (h.schedule.type === 'daily') return 'Every day';
    if (h.schedule.type === 'weekdays') {
      var names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      return h.schedule.days.slice().sort().map(function (d) { return names[d]; }).join(', ');
    }
    if (h.schedule.type === 'weekly') return h.schedule.timesPerWeek + '×/week';
    return '';
  }
  function threshold(h) { return h.type === 'boolean' ? 1 : Math.max(1, Number(h.target) || 1); }
  function valueOn(logs, habitId, k) { var day = logs[k]; return (day && day[habitId]) || 0; }
  function isDone(h, logs, k) { return valueOn(logs, h.id, k) >= threshold(h); }

  function prevScheduled(h, k, floor) {
    var c = addDays(k, -1);
    for (var i = 0; i < 400 && c >= floor; i++) {
      if (isScheduled(h, c)) return c;
      c = addDays(c, -1);
    }
    return null;
  }

  function daysAvailableInWeek(h, wStart) {
    var count = 0;
    for (var i = 0; i < 7; i++) { if (addDays(wStart, i) >= h.createdAt) count++; }
    return count;
  }

  // ---------- Streaks (day-based: daily / weekdays) ----------
  function currentStreakDaily(h, logs, today) {
    var floor = h.createdAt;
    var n = 0;
    if (isScheduled(h, today) && isDone(h, logs, today)) n = 1;
    var cursor = prevScheduled(h, today, floor);
    while (cursor !== null) {
      if (isDone(h, logs, cursor)) { n++; cursor = prevScheduled(h, cursor, floor); }
      else break;
    }
    return n;
  }
  function longestStreakDaily(h, logs, today) {
    var floor = h.createdAt;
    var run = 0, best = 0, k = floor, guard = 0;
    while (k <= today && guard < 3000) {
      guard++;
      if (isScheduled(h, k)) {
        if (k === today && !isDone(h, logs, k)) { /* pending today: neutral */ }
        else { run = isDone(h, logs, k) ? run + 1 : 0; best = Math.max(best, run); }
      }
      k = addDays(k, 1);
    }
    return Math.max(best, currentStreakDaily(h, logs, today));
  }

  // ---------- Streaks (weekly-target) ----------
  function weekCount(h, logs, wStart) {
    var c = 0;
    for (var i = 0; i < 7; i++) { if (isDone(h, logs, addDays(wStart, i))) c++; }
    return c;
  }
  function currentStreakWeekly(h, logs, today, startOfWeek) {
    var target = h.schedule.timesPerWeek;
    var w = weekStart(today, startOfWeek);
    var floorWeek = weekStart(h.createdAt, startOfWeek);
    var n = weekCount(h, logs, w) >= target ? 1 : 0;
    w = addDays(w, -7);
    var guard = 0;
    while (w >= floorWeek && guard < 300) {
      guard++;
      var req = (w === floorWeek) ? Math.min(target, daysAvailableInWeek(h, w)) : target;
      if (weekCount(h, logs, w) >= req) { n++; w = addDays(w, -7); }
      else break;
    }
    return n;
  }
  function longestStreakWeekly(h, logs, today, startOfWeek) {
    var floorWeek = weekStart(h.createdAt, startOfWeek);
    var curWeekStart = weekStart(today, startOfWeek);
    var run = 0, best = 0, w = floorWeek, guard = 0;
    while (w < curWeekStart && guard < 300) {
      guard++;
      var req = (w === floorWeek) ? Math.min(h.schedule.timesPerWeek, daysAvailableInWeek(h, w)) : h.schedule.timesPerWeek;
      if (weekCount(h, logs, w) >= req) { run++; best = Math.max(best, run); } else run = 0;
      w = addDays(w, 7);
    }
    return Math.max(best, currentStreakWeekly(h, logs, today, startOfWeek));
  }

  function habitStreak(h, logs, today, startOfWeek) {
    if (h.schedule.type === 'weekly') {
      return { current: currentStreakWeekly(h, logs, today, startOfWeek), longest: longestStreakWeekly(h, logs, today, startOfWeek), unit: 'wk' };
    }
    return { current: currentStreakDaily(h, logs, today), longest: longestStreakDaily(h, logs, today), unit: 'd' };
  }

  function completionRate(h, logs, today, windowDays, startOfWeek) {
    windowDays = windowDays || 90;
    var from = addDays(today, -(windowDays - 1));
    if (from < h.createdAt) from = h.createdAt;
    if (h.schedule.type === 'weekly') {
      var target = h.schedule.timesPerWeek;
      var w = weekStart(from, startOfWeek);
      var curWeekStart = weekStart(today, startOfWeek);
      var numer = 0, denom = 0, guard = 0;
      while (w < curWeekStart && guard < 300) {
        guard++;
        var req = (w === weekStart(h.createdAt, startOfWeek)) ? Math.min(target, daysAvailableInWeek(h, w)) : target;
        numer += Math.min(weekCount(h, logs, w), req);
        denom += req;
        w = addDays(w, 7);
      }
      return denom === 0 ? { pct: 0, n: 0 } : { pct: numer / denom, n: denom };

    while (k <= today && guard2 < 3000) {

        if (k === today && !isDone(h, logs, k)) { /* exclude pending today */ }
        else { d2++; if (isDone(h, logs, k)) n2++; }
      }
      k = addDays(k, 1);
    }
    return d2 === 0 ? { pct: 0, n: 0 } : { pct: n2 / d2, n: d2 };
  }

  function computeStats(state, today) {
    var startOfWeek = (state.settings && state.settings.startOfWeek) || 0;
    var byHabit = {};
    state.habits.forEach(function (h) {
      if (h.archived) return;
      byHabit[h.id] = { streak: habitStreak(h, state.logs, today, startOfWeek), rate: completionRate(h, state.logs, today, 90, startOfWeek) };
    });
    var heatDays = 182;
    var heatmap = [];
    var startK = addDays(today, -(heatDays - 1));
    for (var k = startK; k <= today; k = addDays(k, 1)) {
      var scheduled = 0, done = 0;
      state.habits.forEach(function (h) {
        if (h.archived || h.createdAt > k) return;
        if (isScheduled(h, k)) { scheduled++; if (isDone(h, state.logs, k)) done++; }
      });
      heatmap.push({ date: k, scheduled: scheduled, done: done, pct: scheduled ? done / scheduled : null });
    }
    var pending = [], doneToday = [], weeklyDoneForWeek = [];
    state.habits.forEach(function (h) {
      if (h.archived || !isScheduled(h, today)) return;
      if (h.schedule.type === 'weekly') {
        var w = weekStart(today, startOfWeek);
        var cnt = weekCount(h, state.logs, w);
        if (cnt >= h.schedule.timesPerWeek && !isDone(h, state.logs, today)) { weeklyDoneForWeek.push(h.id); return; }
      }
      if (isDone(h, state.logs, today)) doneToday.push(h.id); else pending.push(h.id);
    });
    return { byHabit: byHabit, heatmap: heatmap, today: { pending: pending, done: doneToday, weeklyDone: weeklyDoneForWeek, total: pending.length + doneToday.length } };
  }

  // ---------- XP / gamification core ----------
  var MILESTONES = [7, 14, 30, 60, 100, 365];
  var XP_VALUES = { COMPLETION: 10, PARTIAL: 5, PERFECT_DAY: 25, MILESTONE: 50, BADGE: 100 };

  function computeCore(state, today) {
    var habits = state.habits;
    var logs = state.logs;
    var startOfWeek = (state.settings && state.settings.startOfWeek) || 0;
    var earliest = null;
    habits.forEach(function (h) { if (!earliest || h.createdAt < earliest) earliest = h.createdAt; });
    if (!earliest) return { xpBase: 0, totalCompletions: 0, perfectDays: 0, categoriesHit: {}, overachieved: false, maxStreakDays: 0, maxStreakWeeks: 0, maxPerfectDayStreak: 0, perfectWeekend: false };

    var xp = 0, totalCompletions = 0, perfectDays = 0;
    var categoriesHit = {};
    var overachieved = false;
    var maxStreakDays = 0, maxStreakWeeks = 0;
    var runStreak = {}, milestonesSeen = {};
    habits.forEach(function (h) { runStreak[h.id] = 0; milestonesSeen[h.id] = {}; });

    var k = earliest, guard = 0, perfectDayStreak = 0, maxPerfectDayStreak = 0;
    while (k <= today && guard < 3000) {
      guard++;
      var scheduledCount = 0, doneCount = 0;
      habits.forEach(function (h) {
        if (!isScheduled(h, k) || k < h.createdAt) return;
        var pendingToday = (k === today && !isDone(h, logs, k));
        if (pendingToday) return;
        scheduledCount++;
        var v = valueOn(logs, h.id, k);
        var done = v >= threshold(h);
        if (done) {
          doneCount++; totalCompletions++; xp += XP_VALUES.COMPLETION; categoriesHit[h.category] = true;
          if (h.type === 'measurable' && v >= 2 * threshold(h)) overachieved = true;
          if (h.schedule.type !== 'weekly') {
            runStreak[h.id]++;
            if (runStreak[h.id] > maxStreakDays) maxStreakDays = runStreak[h.id];
            if (MILESTONES.indexOf(runStreak[h.id]) !== -1 && !milestonesSeen[h.id][runStreak[h.id]]) {
              milestonesSeen[h.id][runStreak[h.id]] = true; xp += XP_VALUES.MILESTONE;
            }
          }
        } else {
          if (h.type === 'measurable' && v > 0) xp += XP_VALUES.PARTIAL;
          if (h.schedule.type !== 'weekly') runStreak[h.id] = 0;
        }
      });
      var isPerfect = scheduledCount >= 2 && doneCount === scheduledCount;

          <div className="flex gap-2 mb-3">
            {[['daily', 'Daily'], ['weekdays', 'Specific Days'], ['weekly', 'Weekly']].map(function (s) {
              return <button key={s[0]} onClick={function () { setSchedType(s[0]); }} className={'flex-1 py-2 rounded-xl text-xs font-medium border ' + (schedType === s[0] ? 'bg-zinc-100 text-zinc-900 border-transparent' : 'bg-zinc-800 text-zinc-400 border-zinc-700')}>{s[1]}</button>;
            })}
          </div>
          {schedType === 'weekdays' ? (
            <div className="flex gap-1.5 mb-4">
              {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (lbl, i) {
                return <button key={i} onClick={function () { toggleDay(i); }} className={'flex-1 aspect-square rounded-xl text-xs font-medium ' + (days.indexOf(i) !== -1 ? HT.CATEGORIES[category].solid + ' text-white' : 'bg-zinc-800 text-zinc-400')}>{lbl}</button>;
              })}
            </div>
          ) : null}
          {schedType === 'weekly' ? (
            <div className="flex items-center gap-3 mb-4">
              <button onClick={function () { setTimesPerWeek(Math.max(1, timesPerWeek - 1)); }} className="w-9 h-9 rounded-full bg-zinc-800 flex items-center justify-center"><Icon name="minus" size={14} /></button>
              <span className="text-sm text-zinc-200 flex-1 text-center">{timesPerWeek}× per week</span>
              <button onClick={function () { setTimesPerWeek(Math.min(7, timesPerWeek + 1)); }} className="w-9 h-9 rounded-full bg-zinc-800 flex items-center justify-center"><Icon name="plus" size={14} /></button>
            </div>
          ) : null}

          <button onClick={save} disabled={!name.trim()} className="w-full py-3 rounded-2xl bg-violet-500 disabled:opacity-40 text-white font-semibold active:scale-[0.98] transition-transform mb-2">{isEdit ? 'Save Changes' : 'Create Habit'}</button>
          {isEdit ? <button onClick={function () { setConfirmDelete(true); }} className="w-full py-3 rounded-2xl bg-red-500/10 text-red-400 font-semibold text-sm">Delete Habit</button> : null}

          {confirmDelete ? (
            <ConfirmDialog title="Delete habit?" message={'This removes "' + name + '" and all of its logged history. This cannot be undone.'} confirmLabel="Delete" danger
              onCancel={function () { setConfirmDelete(false); }} onConfirm={del} />
          ) : null}
        </div>
      </div>
    );
  }
  function SettingsModal({ onClose }) {
    var state = React.useContext(StateCtx);
    var dispatch = React.useContext(DispatchCtx);
    var [importText, setImportText] = React.useState('');
    var [pendingImport, setPendingImport] = React.useState(null);
    var [confirmReset, setConfirmReset] = React.useState(null);
    var [copyLabel, setCopyLabel] = React.useState('Copy to Clipboard');
    var fileInputRef = React.useRef(null);
    var exportText = React.useMemo(function () { return JSON.stringify(state, null, 2); }, [state]);

    function download() {
      var blob = new Blob([exportText], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'habit-tracker-backup-' + HT.todayKey() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    function copy() {
      function fallback() { var ta = document.getElementById('ht-export-ta'); if (ta) { ta.select(); document.execCommand('copy'); } }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(exportText).then(function () { setCopyLabel('Copied!'); setTimeout(function () { setCopyLabel('Copy to Clipboard'); }, 1500); }).catch(fallback);
      } else { fallback(); setCopyLabel('Copied!'); setTimeout(function () { setCopyLabel('Copy to Clipboard'); }, 1500); }
    }
    function tryImport(text) {
      try {
        var data = JSON.parse(text);
        if (!HT.validateState(data)) throw new Error('invalid');
        var habitCount = data.habits.length;
        var logDays = Object.keys(data.logs || {}).length;
        setPendingImport({ data: data, summary: habitCount + ' habits, ' + logDays + ' logged days — this replaces your current data.' });
      } catch (e) { alert("That file doesn't look like a valid Habit Tracker backup."); }
    }
    function handleFile(e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { tryImport(String(reader.result)); };
      reader.readAsText(f);
    }

    return (
      <div className="fixed inset-0 z-50 flex items-end justify-center">
        <div className="absolute inset-0 bg-black/60" onClick={onClose}></div>
        <div className="relative w-full max-w-md bg-zinc-900 border-t border-zinc-800 rounded-t-3xl p-5 max-h-[88vh] overflow-y-auto" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 24px)', overscrollBehavior: 'contain' }}>
          <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-4"></div>
          <div className="flex items-center justify-between mb-5">
            <h2 className="text-base font-semibold text-zinc-100">Settings</h2>
            <button onClick={onClose} className="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400"><Icon name="x" size={16} /></button>
          </div>

          <p className="text-xs text-zinc-500 mb-1.5">Start of week</p>
          <div className="flex gap-2 mb-6">
            <button onClick={function () { dispatch({ type: 'SETTINGS_SET', settings: { startOfWeek: 0 } }); }} className={'flex-1 py-2 rounded-xl text-xs font-medium ' + ((state.settings.startOfWeek || 0) === 0 ? 'bg-zinc-100 text-zinc-900' : 'bg-zinc-800 text-zinc-400')}>Sunday</button>
            <button onClick={function () { dispatch({ type: 'SETTINGS_SET', settings: { startOfWeek: 1 } }); }} className={'flex-1 py-2 rounded-xl text-xs font-medium ' + ((state.settings.startOfWeek || 0) === 1 ? 'bg-zinc-100 text-zinc-900' : 'bg-zinc-800 text-zinc-400')}>Monday</button>
          </div>

          <p className="text-xs text-zinc-500 mb-1.5">Export data</p>
          <textarea id="ht-export-ta" readOnly value={exportText} className="w-full h-24 bg-zinc-800 rounded-xl px-3 py-2 text-[10px] text-zinc-400 font-mono mb-2" />
          <div className="flex gap-2 mb-6">
            <button onClick={copy} className="flex-1 py-2.5 rounded-xl bg-zinc-800 text-zinc-200 text-xs font-medium">{copyLabel}</button>
            <button onClick={download} className="flex-1 py-2.5 rounded-xl bg-violet-500 text-white text-xs font-medium flex items-center justify-center gap-1"><Icon name="download" size={14} />Download JSON</button>
          </div>

          <p className="text-xs text-zinc-500 mb-1.5">Import data</p>
          <textarea value={importText} onChange={function (e) { setImportText(e.target.value); }} placeholder="Paste exported JSON here…" className="w-full h-20 bg-zinc-800 rounded-xl px-3 py-2 text-[11px] text-zinc-300 font-mono mb-2" />
          <div className="flex gap-2 mb-6">
            <button onClick={function () { fileInputRef.current && fileInputRef.current.click(); }} className="flex-1 py-2.5 rounded-xl bg-zinc-800 text-zinc-200 text-xs font-medium flex items-center justify-center gap-1"><Icon name="upload" size={14} />Choose File</button>
            <button onClick={function () { tryImport(importText); }} disabled={!importText.trim()} className="flex-1 py-2.5 rounded-xl bg-zinc-800 disabled:opacity-40 text-zinc-200 text-xs font-medium">Import Pasted JSON</button>
          </div>
          <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={handleFile} className="hidden" />

          <p className="text-xs text-zinc-500 mb-1.5">Reset</p>
          <div className="flex gap-2 mb-6">
            <button onClick={function () { setConfirmReset('samples'); }} className="flex-1 py-2.5 rounded-xl bg-zinc-800 text-zinc-200 text-xs font-medium">Restore Sample Data</button>
            <button onClick={function () { setConfirmReset('erase'); }} className="flex-1 py-2.5 rounded-xl bg-red-500/10 text-red-400 text-xs font-medium">Erase Everything</button>
          </div>

          <div className="rounded-2xl bg-zinc-800/50 p-3 text-[11px] text-zinc-500 leading-relaxed">
            <p className="mb-1"><strong className="text-zinc-400">About:</strong> Habit Tracker stores everything on this device — nothing is sent to a server.</p>
            <p>Heads up: an installed home-screen app has its own separate storage from Safari. Export a backup before installing, or before switching devices.</p>
          </div>

          {pendingImport ? (
            <ConfirmDialog title="Import backup?" message={pendingImport.summary} confirmLabel="Import"
              onCancel={function () { setPendingImport(null); }}
              onConfirm={function () { dispatch({ type: 'IMPORT_STATE', data: pendingImport.data }); setPendingImport(null); onClose(); }} />
          ) : null}
          {confirmReset ? (
            <ConfirmDialog title={confirmReset === 'erase' ? 'Erase everything?' : 'Restore sample data?'}
              message={confirmReset === 'erase' ? 'This permanently deletes all habits, logs, XP, and badges.' : 'This replaces your current data with the sample habits.'}
              confirmLabel={confirmReset === 'erase' ? 'Erase' : 'Restore'} danger={confirmReset === 'erase'}
              onCancel={function () { setConfirmReset(null); }}
              onConfirm={function () { dispatch({ type: 'RESET', withSamples: confirmReset === 'samples' }); setConfirmReset(null); onClose(); }} />
          ) : null}
        </div>
      </div>
    );
  }

  function NavButton({ it, active, onClick }) {
    return (
      <button onClick={onClick} className={'flex flex-col items-center gap-0.5 px-3 py-1 min-w-[44px] ' + (active ? 'text-violet-400' : 'text-zinc-500')}>
        <Icon name={it.icon} size={20} />
        <span className="text-[10px]">{it.label}</span>
      </button>
    );
  }

  function BottomNav({ tab, setTab, onAdd }) {
    var items = [{ id: 'today', label: 'Today', icon: 'home' }, { id: 'habits', label: 'Habits', icon: 'list-checks' }, { id: 'stats', label: 'Stats', icon: 'bar-chart-3' }];
    return (
      <nav className="fixed bottom-0 left-0 right-0 z-30 bg-zinc-950/90 border-t border-zinc-800" style={{ backdropFilter: 'blur(10px)', paddingBottom: 'env(safe-area-inset-bottom)' }}>
        <div className="max-w-md mx-auto relative flex items-center justify-around px-4 py-2">
          {items.slice(0, 2).map(function (it) { return <NavButton key={it.id} it={it} active={tab === it.id} onClick={function () { setTab(it.id); }} />; })}
          <button onClick={onAdd} className="w-14 h-14 -mt-6 rounded-full bg-violet-500 text-white flex items-center justify-center shadow-lg shadow-violet-500/30 active:scale-95 transition-transform" aria-label="Add habit"><Icon name="plus" size={24} /></button>
          {items.slice(2).map(function (it) { return <NavButton key={it.id} it={it} active={tab === it.id} onClick={function () { setTab(it.id); }} />; })}
        </div>
      </nav>
    );
  }

  function AppHeader({ onSettings }) {
    var ctx = React.useContext(StatsCtx);
    var gam = ctx.gam;
    var hour = new Date().getHours();
    var greeting = hour < 5 ? 'Good night' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    return (
      <header className="px-4 pt-3 pb-2 max-w-md mx-auto flex items-center justify-between gap-3">
        <div className="min-w-0">
          <p className="text-xs text-zinc-500">{greeting}</p>
          <div className="flex items-center gap-2 mt-0.5">
            <LevelBadge level={gam.level} pct={gam.levelInfo.pct} />
            <div className="min-w-0">
              <p className="text-sm font-semibold text-zinc-100 truncate">{gam.tier}</p>
              <p className="text-[11px] text-zinc-500">{gam.xp} XP</p>
            </div>
          </div>
        </div>
        <button onClick={onSettings} className="w-10 h-10 shrink-0 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 active:scale-95 transition-transform" aria-label="Settings"><Icon name="settings" size={18} /></button>
      </header>
    );
  }
  function initState() {
    var loaded = HT.loadState();
    if (loaded) return loaded;
    return HT.finalize(HT.seedState());
  }

  function App() {
    var [state, dispatch] = React.useReducer(HT.reducer, null, initState);
    var [tab, setTab] = React.useState('today');
    var [todayK, setTodayK] = React.useState(HT.todayKey());
    var [modal, setModal] = React.useState(null);
    var [toasts, setToasts] = React.useState([]);
    var prevBadgesRef = React.useRef(state.gamification.badges);
    var prevLevelRef = React.useRef(HT.levelFromXp(state.gamification.xp).level);

    React.useEffect(function () {
      var t = setTimeout(function () { HT.saveState(state); }, 150);
      return function () { clearTimeout(t); };
    }, [state]);

    React.useEffect(function () {
      function flush() { if (document.visibilityState === 'hidden') HT.saveState(state); }
      document.addEventListener('visibilitychange', flush);
      return function () { document.removeEventListener('visibilitychange', flush); };
    }, [state]);

    React.useEffect(function () {
      function tick() { setTodayK(HT.todayKey()); }
      var id = setInterval(tick, 60000);
      document.addEventListener('visibilitychange', tick);
      return function () { clearInterval(id); document.removeEventListener('visibilitychange', tick); };
    }, []);

    React.useEffect(function () {
      var prevBadges = prevBadgesRef.current;
      var newIds = Object.keys(state.gamification.badges).filter(function (id) { return !prevBadges[id]; });
      if (newIds.length) {
        var newToasts = newIds.map(function (id) {
          var b = HT.BADGES.find(function (x) { return x.id === id; });
          return { id: 'badge-' + id + '-' + Date.now(), kind: 'badge', title: 'Badge unlocked', text: b ? b.name : id, icon: b ? b.icon : 'award' };
        });
        setToasts(function (t) { return t.concat(newToasts); });
      }
      prevBadgesRef.current = state.gamification.badges;

      var lvl = HT.levelFromXp(state.gamification.xp).level;
      if (lvl > prevLevelRef.current) {
        setToasts(function (t) { return t.concat([{ id: 'level-' + lvl + '-' + Date.now(), kind: 'level', title: 'Level up!', text: 'Level ' + lvl + ' · ' + HT.TIERS[lvl - 1], icon: 'zap' }]); });
      }
      prevLevelRef.current = lvl;
    }, [state.gamification.badges, state.gamification.xp]);

    function dismissToast(id) { setToasts(function (t) { return t.filter(function (x) { return x.id !== id; }); }); }

    var stats = React.useMemo(function () { return HT.computeStats(state, todayK); }, [state.habits, state.logs, state.settings, todayK]);
    var gam = React.useMemo(function () { return HT.computeGamification(state, todayK); }, [state.habits, state.logs, todayK]);
    var statsBundle = { stats: stats, gam: gam, todayK: todayK };

    function openHabitForm(habit) { setModal({ type: 'habitForm', habit: habit || null }); }
    function closeModal() { setModal(null); }

    return (
      <StateCtx.Provider value={state}>
        <DispatchCtx.Provider value={dispatch}>
          <StatsCtx.Provider value={statsBundle}>
            <div className="min-h-screen bg-zinc-950 text-zinc-100 pb-24" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
              <AppHeader onSettings={function () { setModal({ type: 'settings' }); }} />
              <main className="px-4 max-w-md mx-auto">
                {tab === 'today' ? <TodayView onEditHabit={openHabitForm} /> : null}
                {tab === 'habits' ? <HabitsView onEditHabit={openHabitForm} /> : null}
                {tab === 'stats' ? <StatsView /> : null}
              </main>
              <BottomNav tab={tab} setTab={setTab} onAdd={function () { openHabitForm(null); }} />
              <div className="fixed left-0 right-0 flex flex-col items-center gap-2 z-40 px-4" style={{ bottom: 'calc(env(safe-area-inset-bottom) + 76px)' }}>
                {toasts.map(function (t) { return <Toast key={t.id} toast={t} onDismiss={function () { dismissToast(t.id); }} />; })}
              </div>
              {modal && modal.type === 'habitForm' ? <HabitFormModal habit={modal.habit} onClose={closeModal} /> : null}
              {modal && modal.type === 'settings' ? <SettingsModal onClose={closeModal} /> : null}
            </div>
          </StatsCtx.Provider>
        </DispatchCtx.Provider>
      </StateCtx.Provider>
    );
  }

  var root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  window.__HT_MOUNTED = true;
})();
</script>

<script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.__HT_MOUNTED) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px;text-align:center;color:#a1a1aa;background:#09090b;"><p style="font-size:16px;font-weight:600;color:#e4e4e7;">Couldn\'t load the app</p><p style="font-size:13px;max-width:280px;">Check your internet connection and reload — this app needs to download some resources the first time.</p></div>';
      }
    }, 4000);
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  });
</script>
</body>
</html>
